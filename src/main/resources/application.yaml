spring:
  application:
    name: Expensive-Tracker

  datasource:
    url: jdbc:postgresql://localhost:5432/expense_tracker
    username: root
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always

server:
  port: 8080