spring:
  application:
    name: Expensive-Tracker

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/expense_tracker?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:thisisadevonlysecret_pleaseoverrideinproduction1234567890}
  expiration-ms: ${JWT_EXPIRATION_MS:1800000}
  issuer: ${JWT_ISSUER:expense-tracker}

app:
  security:
    login:
      max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
      window-minutes: ${LOGIN_WINDOW_MINUTES:1}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
